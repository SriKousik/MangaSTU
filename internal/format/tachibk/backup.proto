syntax = "proto2";

package tachibk;

option go_package = "github.com/misfit/mangastu/internal/format/tachibk/pb";

// NOTE: Generate with:
//   protoc --proto_path=internal/format/tachibk --go_out=internal/format/tachibk/pb --go_opt=paths=source_relative backup.proto

// Top-level backup container.
// Field numbers must match Komikku's @ProtoNumber annotations exactly.
message Backup {
    repeated BackupManga backup_manga = 1;
    repeated BackupCategory backup_categories = 2;
    // Field 100 was legacy broken sources (skipped)
    repeated BackupSource backup_sources = 101;
    repeated BackupPreference backup_preferences = 104;
    repeated BackupSourcePreferences backup_source_preferences = 105;
}

// A single manga entry with all associated data embedded inline.
message BackupManga {
    required int64 source = 1;
    required string url = 2;
    optional string title = 3;
    optional string artist = 4;
    optional string author = 5;
    optional string description = 6;
    repeated string genre = 7;
    optional int32 status = 8;
    optional string thumbnail_url = 9;
    // 10 = customCover (1.x, unused)
    // 11 = lastUpdate (1.x, unused)
    // 12 = lastInit (1.x, unused)
    optional int64 date_added = 13;
    optional int32 viewer = 14;
    // 15 = flags (1.x, unused)
    repeated BackupChapter chapters = 16;
    repeated int64 categories = 17;
    repeated BackupTracking tracking = 18;
    // Values not in 1.x but used in 0.x (bumped by 100)
    optional bool favorite = 100;
    optional int32 chapter_flags = 101;
    // 102 = broken history (legacy)
    optional int32 viewer_flags = 103;
    repeated BackupHistory history = 104;
    optional UpdateStrategy update_strategy = 105;
    optional int64 last_modified_at = 106;
    optional int64 favorite_modified_at = 107;
    repeated string excluded_scanlators = 108;
    optional int64 version = 109;
    optional string notes = 110;
}

// A single chapter.
message BackupChapter {
    required string url = 1;
    required string name = 2;
    optional string scanlator = 3;
    optional bool read = 4;
    optional bool bookmark = 5;
    optional int64 last_page_read = 6;
    optional int64 date_fetch = 7;
    optional int64 date_upload = 8;
    optional float chapter_number = 9;
    optional int64 source_order = 10;
    optional int64 last_modified_at = 11;
    optional int64 version = 12;
}

// A library category.
message BackupCategory {
    required string name = 1;
    optional int64 order = 2;
    optional int64 id = 3;
    // Values not in 1.x (bumped by 100)
    optional int64 flags = 100;
}

// A tracker entry.
message BackupTracking {
    required int32 sync_id = 1;
    required int64 library_id = 2;
    optional int32 media_id_int = 3;  // deprecated, use media_id
    optional string tracking_url = 4;
    optional string title = 5;
    optional float last_chapter_read = 6;
    optional int32 total_chapters = 7;
    optional float score = 8;
    optional int32 status = 9;
    optional int64 started_reading_date = 10;
    optional int64 finished_reading_date = 11;
    optional bool private = 12;
    optional int64 media_id = 100;
}

// Reading history for a chapter.
message BackupHistory {
    required string url = 1;
    required int64 last_read = 2;
    optional int64 read_duration = 3;
}

// A source mapping (source ID → name).
message BackupSource {
    optional string name = 1;
    required int64 source_id = 2;
}

// App or source preferences.
message BackupPreference {
    required string key = 1;
    required PreferenceValue value = 2;
}

// Source-specific preferences.
message BackupSourcePreferences {
    required string source_key = 1;
    repeated BackupPreference prefs = 2;
}

// Preference value - using type discriminator matching kotlinx.serialization.
message PreferenceValue {
    required string type = 1;
    required bytes truevalue = 2;
}

// Update strategy enum.
enum UpdateStrategy {
    ALWAYS_UPDATE = 0;
    ONLY_FETCH_ONCE = 1;
}
